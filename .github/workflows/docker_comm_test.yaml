name: Docker Communication Test

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Install Docker Compose
      run: sudo apt-get update && sudo apt-get install -y docker-compose

    - name: Build and run containers
      run: docker-compose up -d

    - name: Show IP addresses
      run: |
        docker exec app1 ip addr show eth0
        docker exec app2 ip addr show eth0

    - name: Test communication between containers
      run: |
        docker exec app1 ping -c 4 172.18.0.3  # Ping from app1 to app2
        docker exec app2 ping -c 4 172.18.0.2  # Ping from app2 to app1

    - name: Tear down containers
      run: docker-compose down
